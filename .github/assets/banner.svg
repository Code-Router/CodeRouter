<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="CodeRouter">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74e86a"/>
      <stop offset="1" stop-color="#16c45a"/>
    </linearGradient>
    <linearGradient id="track" x1="-166.4" y1="0" x2="30" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity=".45"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="halo" cx="0.28" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-200" y="-50" width="450" height="300">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .s { fill: none; stroke: url(#g); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .track { fill: none; stroke: url(#track); stroke-width: 4; stroke-linecap: round; }
      .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.65,0,.35,1) forwards; }
      .d0 { animation-delay: 0s; } .d1 { animation-delay: .25s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .8s; }
      .head { opacity: 0; transform-box: fill-box; transform-origin: 30% 50%; animation: pop .45s cubic-bezier(.3,1.6,.5,1) forwards; }
      .h1 { animation-delay: 1.35s; } .h2 { animation-delay: 1.5s; } .h3 { animation-delay: 1.65s; }
      .pulse { fill: none; stroke: #f0fff4; stroke-width: 8; stroke-linecap: round; filter: url(#glow); opacity: 0;
               animation-duration: 3.6s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 2s; }
      .word { opacity: 0; animation: word .9s cubic-bezier(.2,.8,.2,1) 1.2s forwards; }
      .word text { font: 700 92px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -2.5px; }
      .word .tag { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .5px; }
      .breath { transform-origin: 336px 170px; animation: breath 4.8s ease-in-out 2s infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
      @keyframes word { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
      @keyframes breath { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes pin { 0%, 0.0% { stroke-dashoffset: 9; opacity: 0; } 0.5% { opacity: 1; } 38.0% { opacity: 1; } 42.0%, 100% { stroke-dashoffset: -196.4; opacity: 0; } }
      @keyframes ptop { 0%, 42.0% { stroke-dashoffset: 9; opacity: 0; } 42.5% { opacity: 1; } 77.3% { opacity: 1; } 81.3%, 100% { stroke-dashoffset: -183.9; opacity: 0; } }
      @keyframes pmid { 0%, 42.0% { stroke-dashoffset: 9; opacity: 0; } 42.5% { opacity: 1; } 85.4% { opacity: 1; } 89.4%, 100% { stroke-dashoffset: -221.5; opacity: 0; } }
      @keyframes plow { 0%, 42.0% { stroke-dashoffset: 9; opacity: 0; } 42.5% { opacity: 1; } 82.6% { opacity: 1; } 86.6%, 100% { stroke-dashoffset: -208.5; opacity: 0; } }
      @keyframes pbot { 0%, 42.0% { stroke-dashoffset: 9; opacity: 0; } 42.5% { opacity: 1; } 76.5% { opacity: 1; } 80.5%, 100% { stroke-dashoffset: -179.9; opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .draw { animation: none; stroke-dashoffset: 0; } .head, .word { animation: none; opacity: 1; } .pulse, .breath { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0b0f0d"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#halo)" class="breath"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <g transform="translate(203 45) scale(1.25)">
    <path class="track draw d0" pathLength="1" d="M-166.40 100.00 L30.00 100.00"/>
    <path class="s draw d1" pathLength="1" d="M30.00 100.00 L30.00 66.00 L92.00 27.00 L140.00 57.00 L156.00 57.00"/>
    <path class="s draw d1" pathLength="1" d="M30.00 100.00 L30.00 134.00 L92.00 173.00 L140.00 143.00 L152.00 143.00"/>
    <path class="s draw d2" pathLength="1" d="M56.00 49.65 L82.00 102.00 L50.00 146.58"/>
    <path class="s draw d2" pathLength="1" d="M82.00 102.00 L112.00 102.00"/>
    <path class="s draw d3" pathLength="1" d="M74.00 38.32 L106.00 80.00 L120.00 80.00 L140.00 101.00 L174.00 101.00"/>
    <path class="s draw d3" pathLength="1" d="M62.00 154.13 L106.00 122.00 L120.00 122.00 L138.00 103.00"/>

    <path class="s head h1" d="M150 46 L161 57 L150 68"/>
    <path class="s head h2" d="M170 90 L181 101 L170 112"/>
    <path class="s head h3" d="M146 132 L157 143 L146 154"/>

    <path class="pulse" style="stroke-dasharray:9 205.4;animation-name:pin" d="M-166.40 100.00 L30.00 100.00"/>
    <path class="pulse" style="stroke-dasharray:9 192.9;animation-name:ptop" d="M30.00 100.00 L30.00 66.00 L92.00 27.00 L140.00 57.00 L160.00 57.00"/>
    <path class="pulse" style="stroke-dasharray:9 230.5;animation-name:pmid" d="M30.00 100.00 L30.00 66.00 L74.00 38.32 L106.00 80.00 L120.00 80.00 L140.00 101.00 L180.00 101.00"/>
    <path class="pulse" style="stroke-dasharray:9 217.5;animation-name:plow" d="M30.00 100.00 L30.00 134.00 L62.00 154.13 L106.00 122.00 L120.00 122.00 L138.00 103.00 L180.00 101.00"/>
    <path class="pulse" style="stroke-dasharray:9 188.9;animation-name:pbot" d="M30.00 100.00 L30.00 134.00 L92.00 173.00 L140.00 143.00 L156.00 143.00"/>
  </g>

  <g class="word">
    <text x="470" y="196" fill="#f4f7f5">CodeRouter</text>
    <text x="474" y="238" class="tag" fill="#6ee7a0">the right model for every task</text>
  </g>
</svg>
