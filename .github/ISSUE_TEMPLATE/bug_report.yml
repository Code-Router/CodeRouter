name: Bug report
description: Something in CodeRouter isn't working
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Desktop app
        - CLI
        - VS Code / Cursor extension
        - MCP (Claude Code / Codex)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings, then About in the app, or `coderouter --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.5 (Apple Silicon) / Windows 11
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove API keys and anything private first.
